[project]
name = "dealwaggle"
version = "0.1.0"
description = "Private dealflow, shared with intent."
requires-python = ">=3.13"
dependencies = ["dealwaggle-backend", "dealwaggle-database"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "database"]

[tool.uv.sources]
dealwaggle-backend = { workspace = true }
dealwaggle-database = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

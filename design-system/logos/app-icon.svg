<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512" role="img" aria-label="DealWaggle"><style>.dw-mark{--dw-honey:var(--dw-accent,#F5A524);overflow:visible}
.dw-orbit{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:0 4.189;opacity:.45}
.dw-run{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dw-trail{fill:none;stroke:var(--dw-honey);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:12 88;stroke-dashoffset:12;opacity:0;transition:opacity .25s}
.dw-bee{offset-path:path("M24 28V16A12 12 0 0 1 24 40V16A12 12 0 0 0 24 40V28");offset-distance:0%;offset-rotate:auto}
.dw-wings{fill:currentColor;fill-opacity:.18;stroke:currentColor;stroke-width:.7}
.dw-abdomen{fill:var(--dw-honey);stroke:currentColor;stroke-width:.9}
.dw-stripes{fill:none;stroke:currentColor;stroke-width:1.1}
.dw-head{fill:currentColor}
/* --dw-orbit shrinks the dance around its centre; the bee is compensated so --dw-bee stays its real size. */
.dw-dance{transform:translate(24px,28px) scale(var(--dw-orbit,1)) translate(-24px,-28px)}
.dw-bee-scale{transform:scale(calc(var(--dw-bee,1) / var(--dw-orbit,1)))}
@supports not (offset-path:path("M0 0")){.dw-bee{transform:translate(24px,28px) rotate(-90deg)}}

.dw-mark:hover .dw-bee,.dw-loading .dw-bee{animation:dw-dance var(--dw-speed,3s) linear infinite}
.dw-mark:hover .dw-bee-body,.dw-loading .dw-bee-body{animation:dw-waggle var(--dw-speed,3s) linear infinite}
.dw-mark:hover .dw-wings,.dw-loading .dw-wings{animation:dw-flutter .06s linear infinite alternate}
.dw-mark:hover .dw-trail,.dw-loading .dw-trail{opacity:.95;animation:dw-trail var(--dw-speed,3s) linear infinite}

/* Slow, straight waggle runs; quick return loops. Bee and trail share the timeline. */
@keyframes dw-dance{
0%{offset-distance:0%}
16%{offset-distance:9.725%;animation-timing-function:ease-in-out}
34%{offset-distance:40.275%;animation-timing-function:linear}
66%{offset-distance:59.725%;animation-timing-function:ease-in-out}
84%{offset-distance:90.275%;animation-timing-function:linear}
100%{offset-distance:100%}}
@keyframes dw-trail{
0%{stroke-dashoffset:12}
16%{stroke-dashoffset:-.465;animation-timing-function:ease-in-out}
34%{stroke-dashoffset:-25.535;animation-timing-function:linear}
66%{stroke-dashoffset:-50.465;animation-timing-function:ease-in-out}
84%{stroke-dashoffset:-75.535;animation-timing-function:linear}
100%{stroke-dashoffset:-88}}
/* The body only waggles during runs (0–16%, 34–66%, 84–100%). */
@keyframes dw-waggle{
0%,16%,34%,66%,84%,100%{transform:rotate(0)}
2%,6%,10%,14%,36%,40%,44%,48%,52%,56%,60%,64%,86%,90%,94%,98%{transform:rotate(18deg)}
4%,8%,12%,38%,42%,46%,50%,54%,58%,62%,88%,92%,96%{transform:rotate(-18deg)}}
@keyframes dw-flutter{to{transform:scaleY(.45)}}
@keyframes dw-pulse{50%{transform:scale(1.2);opacity:.55}}

@media (prefers-reduced-motion:reduce){
.dw-mark:hover .dw-bee,.dw-loading .dw-bee,.dw-mark:hover .dw-bee-body,.dw-loading .dw-bee-body,
.dw-mark:hover .dw-wings,.dw-loading .dw-wings,.dw-mark:hover .dw-trail,.dw-loading .dw-trail{animation:none}
.dw-mark:hover .dw-trail,.dw-loading .dw-trail{opacity:0}
.dw-mark:hover .dw-bee-body,.dw-loading .dw-bee-body{animation:dw-pulse 1.6s ease-in-out infinite}}
svg.dw-mark.dw-on-honey{color:#211C15;--dw-honey:#FFF6DF}</style><rect width="48" height="48" rx="10.6" fill="#F5A524"/><svg class="dw-mark dw-on-honey" x="3.4" y="3.4" width="41.2" height="41.2" viewBox="6 10 36 36"><g transform="rotate(30 24 28)"><g class="dw-dance">
<circle class="dw-orbit" cx="24" cy="28" r="12"/>
<path class="dw-run" d="M24 40L25.8 38.5L22.2 35.5L25.8 32.5L22.2 29.5L25.8 26.5L22.2 23.5L25.8 20.5L22.2 17.5L24 16"/>
<path class="dw-trail" pathLength="100" d="M24 28L25.8 26.5L22.2 23.5L25.8 20.5L22.2 17.5L24 16A12 12 0 0 1 24 40L25.8 38.5L22.2 35.5L25.8 32.5L22.2 29.5L25.8 26.5L22.2 23.5L25.8 20.5L22.2 17.5L24 16A12 12 0 0 0 24 40L25.8 38.5L22.2 35.5L25.8 32.5L22.2 29.5L24 28"/>
<g class="dw-bee"><g class="dw-bee-scale"><g class="dw-bee-body">
<g class="dw-wings"><ellipse cx="-1.2" cy="-2.8" rx="2.3" ry="1.3" transform="rotate(30 -1.2 -2.8)"/><ellipse cx="-1.2" cy="2.8" rx="2.3" ry="1.3" transform="rotate(-30 -1.2 2.8)"/></g>
<ellipse class="dw-abdomen" cx="-.3" cy="0" rx="3.6" ry="2.4"/>
<path class="dw-stripes" d="M-1.6 -2.1V2.1M.4 -2.2V2.2"/>
<circle class="dw-head" cx="3.9" cy="0" r="1.5"/>
</g></g></g>
</g></g></svg></svg>

[project]
name = "dealwaggle-database"
version = "0.1.0"
description = "DealWaggle knowledge and access model"
requires-python = ">=3.13"
dependencies = ["SQLAlchemy>=2.0.40,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/dealwaggle_db"]

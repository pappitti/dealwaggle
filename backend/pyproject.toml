[project]
name = "dealwaggle-backend"
version = "0.1.0"
description = "DealWaggle API and durable workflow workers"
requires-python = ">=3.13"
dependencies = [
  "dealwaggle-database", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3",
  "svix>=1.60,<2", "stripe>=12,<15"
]
[project.scripts]
dealwaggle-worker = "dealwaggle.worker:main"
dealwaggle-demo = "dealwaggle.seed:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/dealwaggle"]
